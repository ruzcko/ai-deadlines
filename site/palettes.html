<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Palette candidates</title>
<style>
  body { margin: 0; font: 15px/1.4 Inter, system-ui, sans-serif; background: #777; color: #111; }
  header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #eee; position: sticky; top: 0; z-index: 2; }
  header b { font-size: 16px; }
  header button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #999; background: #fff; cursor: pointer; }
  header button[aria-pressed="true"] { background: #111; color: #fff; }
  .grid { display: flex; gap: 14px; padding: 14px; overflow-x: auto; }
  figure { margin: 0; flex: none; }
  figcaption { color: #fff; font-weight: 700; margin-bottom: 6px; }
  figcaption small { font-weight: 400; opacity: .85; display: block; }
  iframe { width: 390px; height: 1100px; border: 0; border-radius: 14px; background: #fff; }
</style>
</head>
<body>
<header><b>Palette candidates</b>
  <button type="button" data-theme="dark" aria-pressed="true">Dark</button>
  <button type="button" data-theme="light" aria-pressed="false">Light</button>
  <span>Each frame is the real site at phone width. Star a few venues in one to see the gaps card.</span>
</header>
<div class="grid" id="grid"></div>
<script>
  const P = [["", "Current", "the default we have now"], ["ink", "1 · Ink & Paper", "editorial, warm paper, vermilion"], ["signal", "2 · Signal", "departures board, orange-red + amber"], ["campus", "3 · Campus", "forest green, cream, brick"]];
  function draw(theme) {
    document.getElementById("grid").innerHTML = P.map(([k, name, note]) =>
      `<figure><figcaption>${name}<small>${note}</small></figcaption><iframe src="/?${k ? "palette=" + k + "&" : ""}theme=${theme}" loading="lazy" title="${name}"></iframe></figure>`).join("");
  }
  document.querySelectorAll("header button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("header button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    draw(b.dataset.theme);
  }));
  draw("dark");
</script>
</body>
</html>
