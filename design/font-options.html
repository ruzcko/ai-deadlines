      fonts: "family=Inter:wght@400..800", body: "Inter", head: "Inter", num: "Inter" },
    { name: "A · Newsreader + Source Sans 3", lic: "OFL · Google Fonts", feel: "A journal or a paper: serif headings and numbers, calm sans text. Speaks to people who write papers.",
      fonts: "family=Newsreader:opsz,wght@6..72,500..800&family=Source+Sans+3:wght@400..700", body: '"Source Sans 3"', head: "Newsreader", num: "Newsreader", headWeight: 700 },
    { name: "B · Chivo + Chivo Mono", lic: "OFL · Google Fonts", feel: "A departures board: a sturdy grotesque, with every countdown and date in mono, like flight times ticking down.",
      fonts: "family=Chivo:wght@400..900&family=Chivo+Mono:wght@400..800", body: "Chivo", head: "Chivo", num: '"Chivo Mono"', numSpacing: "-.04em" },
    { name: "C · Archivo (condensed numbers)", lic: "OFL · Google Fonts", feel: "A scoreboard: narrow, heavy numbers fit big countdowns on a phone; headings are tighter and firmer.",
      fonts: "family=Archivo:wdth,wght@62..125,400..900", body: "Archivo", head: "Archivo", num: "Archivo", numStretch: "72%", headStretch: "90%" },
  ];
  const override = (o) => `
    body, button, input, kbd { font-family: ${o.body}, system-ui, sans-serif !important; }
    .hero h1, .hero h1 button, .brand, .info .name, .cal-nav h2 { font-family: ${o.head}, serif !important; ${o.headStretch ? `font-stretch: ${o.headStretch};` : ""} ${o.headWeight ? `font-weight: ${o.headWeight} !important;` : ""} }
    .clock .n, .cdbox .big, .run em, .count, .info .when, .bucket h3 .n { font-family: ${o.num}, ui-monospace, monospace !important; ${o.numStretch ? `font-stretch: ${o.numStretch};` : ""} ${o.numSpacing ? `letter-spacing: ${o.numSpacing};` : ""} }
    a, button, input, label { pointer-events: none; }`;
  const doc = (o, theme) => `<!doctype html><html lang="en" data-theme="${theme}"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?${o.fonts}&display=swap">
    <style>${css}</style><style>${override(o)}</style></head><body>${snap}</body></html>`;
  const frames = OPTIONS.map((o) => {
    const fig = document.createElement("figure");
    fig.innerHTML = "<figcaption><b></b><span></span></figcaption><iframe></iframe>";
    fig.querySelector("b").textContent = `${o.name} (${o.lic})`;
    fig.querySelector("span").textContent = o.feel;
    const f = fig.querySelector("iframe");
    f.title = o.name;
    document.getElementById("grid").append(fig);
    return { f, o };
  });
  const render = (theme) => frames.forEach(({ f, o }) => { f.srcdoc = doc(o, theme); });
  render("light");
  document.querySelector(".bar").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-theme]");
    if (!b) return;
    for (const x of document.querySelectorAll("[data-theme]")) x.setAttribute("aria-pressed", x === b);
    render(b.dataset.theme);
  });
</script>
</body>
</html>
